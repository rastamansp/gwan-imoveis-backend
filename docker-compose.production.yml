services:
  gwan-imoveis-backend:
    build:
      context: .
      # Dockerfile padrão - sem migrations (para produção com banco existente)
      # Use Dockerfile.with-migrations se precisar executar migrations automaticamente
      dockerfile: Dockerfile
    container_name: gwan-imoveis-backend
    restart: unless-stopped
    environment:
      # Configurações básicas
      - NODE_ENV=production
      - PORT=3001
      
      # API Base URL
      - API_BASE_URL=https://imoveis-api.gwan.cloud

      # Database (usando DATABASE_URL completa)
      - DATABASE_URL=${DATABASE_URL}
      
      # JWT
      - JWT_SECRET=${JWT_SECRET}
      
      # CORS para frontend
      - CORS_ORIGINS=${CORS_ORIGINS}
      
      # MCP Server
      - MCP_BASE_URL=https://imoveis-api.gwan.cloud
      - MCP_PORT_SSE=3002
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN}
      
      # OpenAI (para chatbot)
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-haiku-4-5}
      - CLAUDE_FALLBACK_MODELS=${CLAUDE_FALLBACK_MODELS:-claude-haiku-4-5-20251001,claude-sonnet-4-6}
      
      # Evolution API (WhatsApp)
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE}
      - EVOLUTION_INSTANCE_URL=${EVOLUTION_INSTANCE_URL}
      - EVOLUTION_INSTANCE_NAME=${EVOLUTION_INSTANCE_NAME}
      
      # MinIO (Storage de Imagens)
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_PORT=${MINIO_PORT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - MINIO_USE_SSL=${MINIO_USE_SSL}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL}

      # Redis Cache (se necessário)
      - REDIS_URL=${REDIS_URL}
      
    volumes:
      - logs_data:/app/logs
      
    networks:
      - gwan-network
      
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      
    labels:
      # HTTP Router (redireciona para HTTPS)
      - "traefik.enable=true"
      - "traefik.docker.network=gwan-network"

      # HTTP Router (redireciona para HTTPS)
      - "traefik.http.routers.gwan-imoveis-backend-http.rule=Host(`imoveis-api.gwan.cloud`)"
      - "traefik.http.routers.gwan-imoveis-backend-http.entrypoints=web"
      - "traefik.http.routers.gwan-imoveis-backend-http.middlewares=imoveis-backend-https-redirect"

      # HTTPS Router
      - "traefik.http.routers.gwan-imoveis-backend.rule=Host(`imoveis-api.gwan.cloud`)"
      - "traefik.http.routers.gwan-imoveis-backend.entrypoints=websecure"
      - "traefik.http.routers.gwan-imoveis-backend.tls=true"
      - "traefik.http.routers.gwan-imoveis-backend.tls.certresolver=letsencrypt"

      # Service configuration
      - "traefik.http.services.gwan-imoveis-backend.loadbalancer.server.port=3001"

      # Middleware para redirecionamento HTTP -> HTTPS
      - "traefik.http.middlewares.imoveis-backend-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.imoveis-backend-https-redirect.redirectscheme.permanent=true"

volumes:
  logs_data:
    driver: local

networks:
  gwan-network:
    external: true
