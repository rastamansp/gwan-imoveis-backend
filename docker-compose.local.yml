services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gwan-imoveis-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "pazdeDeus@2025"
      POSTGRES_DB: gwan_imoveis
    volumes:
      - gwan_imoveis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gwan_imoveis"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: gwan-imoveis-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: pazdedeus2025
    command: server /data --console-address ":9001"
    volumes:
      - gwan_imoveis_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: gwan-imoveis-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 admin pazdedeus2025;
      mc mb --ignore-existing local/gwan-imoveis-uploads;
      mc anonymous set public local/gwan-imoveis-uploads;
      echo 'Bucket gwan-imoveis-uploads criado e configurado.';
      "

volumes:
  gwan_imoveis_postgres_data:
    driver: local
  gwan_imoveis_minio_data:
    driver: local
